name: Build RPMs

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and Release RPMs
    runs-on: ubuntu-latest
    container:
      image: fedora:latest

    steps:
      - name: Install build tools
        run: |
          dnf -y update
          dnf -y install git make curl python3 rpmdevtools rpm-build spectool dnf5-plugins

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install mgba build dependencies
        run: dnf -y builddep SPECS/mgba.spec

      - name: Build RPMs
        run: make build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rpm-packages-${{ github.run_id }}
          path: |
            RPMS/**/*.rpm
            SRPMS/*.src.rpm
          if-no-files-found: error

      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            RPMS/**/*.rpm
            SRPMS/*.src.rpm
          draft: false
          prerelease: false
